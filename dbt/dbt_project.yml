name: gcp_lab
version: "1.0"
profile: gcp_lab

models:
  gcp_lab:
    silver:
      +schema: silver               # BigQuery dataset `silver`
      +materialized: table          # native BigQuery tables
    gold:
      +schema: gold                 # BigQuery dataset `gold`
      +materialized: table
      +catalog_name: lake_iceberg   # catalogs.yml -> BigQuery-managed Iceberg
      +base_location_root: iceberg  # files in gs://<lake>/iceberg/gold/<model>/ (next to bronze.db/)
      +persist_docs: {columns: true}   # applies column policy_tags from gold.yml after each build
      +post-hook:
        # Row access policies (≈ Lake Formation data filters). CREATE OR REPLACE TABLE drops them, so recreate
        # each build. Once a table has any policy, a user in no policy sees 0 rows: hence `all_rows`.
        - >
          CREATE OR REPLACE ROW ACCESS POLICY nsw_only ON {{ this }}
          GRANT TO ("serviceAccount:lab-analyst-nsw@{{ env_var('PROJECT_ID') }}.iam.gserviceaccount.com")
          FILTER USING (customer_state = 'NSW')
        - >
          CREATE OR REPLACE ROW ACCESS POLICY all_rows ON {{ this }}
          GRANT TO ("user:{{ env_var('OWNER_EMAIL') }}",
                    "serviceAccount:lab-admin@{{ env_var('PROJECT_ID') }}.iam.gserviceaccount.com",
                    "serviceAccount:lab-analyst@{{ env_var('PROJECT_ID') }}.iam.gserviceaccount.com")
          FILTER USING (TRUE)
        # BigQuery keeps Iceberg metadata internally; export it so other engines (Spark, Trino) can read the table.
        - "EXPORT TABLE METADATA FROM {{ this }}"
