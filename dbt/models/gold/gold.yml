version: 2

models:
  - name: fct_sales
    description: Transactions + customer, product, campaign details. BigQuery-managed Iceberg table.
    config:
      post_hook:
        # Row access policies (≈ Lake Formation data filters). CREATE OR REPLACE TABLE drops them, so recreate
        # each build. Once a table has any policy, a user in no policy sees 0 rows: hence `all_rows`.
        # The dbt runner (you) must be in all_rows, or tests would silently pass on 0 rows.
        - >
          CREATE OR REPLACE ROW ACCESS POLICY nsw_only ON {{ this }}
          GRANT TO ("serviceAccount:lab-analyst-nsw@{{ env_var('PROJECT_ID') }}.iam.gserviceaccount.com")
          FILTER USING (customer_state = 'NSW')
        - >
          CREATE OR REPLACE ROW ACCESS POLICY all_rows ON {{ this }}
          GRANT TO ("user:{{ env_var('OWNER_EMAIL') }}",
                    "serviceAccount:lab-admin@{{ env_var('PROJECT_ID') }}.iam.gserviceaccount.com",
                    "serviceAccount:lab-analyst@{{ env_var('PROJECT_ID') }}.iam.gserviceaccount.com")
          FILTER USING (TRUE)
    columns:
      # Policy tags (column-level security): only fine-grained readers (lab-admin) may select these.
      - name: customer_email
        policy_tags: ["{{ env_var('PII_TAG') }}"]
      - name: customer_first_name
        policy_tags: ["{{ env_var('PII_TAG') }}"]
      - name: customer_last_name
        policy_tags: ["{{ env_var('PII_TAG') }}"]
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: customer_state
        data_tests: [not_null]   # phase 4 row access policy filters on it
      - name: customer_id
        data_tests:
          - relationships: {arguments: {to: ref('customer'), field: customer_id}}
      - name: product_id
        data_tests:
          - relationships: {arguments: {to: ref('product'), field: product_id}}
